<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>FO Açores</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="hero">
  <div class="hero-logo">🧵</div>
  <h1>FO Açores</h1>
  <p class="subtitle">Aplicação de Pesquisa de Fibra Óptica</p>

  <button class="primary hero-cta" onclick="window.location.href='app.html'">🔍 Iniciar Pesquisa</button>

  <div class="hero-grid">
    <div class="hero-tile" onclick="window.location.href='app.html'">
      <span class="hero-tile-icon">📂</span>
      <span class="hero-tile-label">Pesquisa</span>
    </div>
    <div class="hero-tile" onclick="window.location.href='mapa.html'">
      <span class="hero-tile-icon">🗺️</span>
      <span class="hero-tile-label">Mapa</span>
    </div>
    <div class="hero-tile" onclick="window.location.href='calculadora.html'">
      <span class="hero-tile-icon">🎨</span>
      <span class="hero-tile-label">Calculadora</span>
    </div>
  </div>

  <div class="hero-footer">Pesquisa F.O · funciona offline</div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js');
  });
}
</script>
</body>
</html>
