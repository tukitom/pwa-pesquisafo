<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PesquisaFO">
<title>Pesquisa F.O</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <nav>
    <button onclick="window.location.href='index.html'">🏠 Início</button>
    <button class="active" onclick="window.location.href='app.html'">📂 CSV</button>
    <button onclick="window.location.href='calculadora.html'">🎨 Calculadora</button>
    <button onclick="window.location.href='mapa.html'">🗺️ Mapa</button>
  </nav>
</header>

<div id="app">

  <div class="card">
    <p class="card-title">📄 Ficheiro</p>
    <input type="file" id="btnLoadCsv" accept=".csv,.txt" aria-label="Carregar ficheiro CSV">
    <div id="textFileName" class="file-status">Nenhum ficheiro carregado</div>
    <div id="csvAgeWarning" class="csv-age-warning" style="display:none;"></div>
    <button id="btnForgetCsv" class="history-clear" style="display:none;">🗑️ Esquecer ficheiro guardado</button>
  </div>

  <div class="card">
    <p class="card-title">🔌 SRO</p>
    <div class="spinner-row">
      <label for="spinnerSro">SRO</label>
      <select id="spinnerSro"></select>
    </div>
    <div class="spinner-row">
      <label for="spinnerSplitter">Splitter (SRO)</label>
      <select id="spinnerSplitter">
        <option value="">-- Selecionar --</option>
      </select>
    </div>
  </div>

  <div class="divider-or">ou</div>

  <div class="card">
    <p class="card-title">🔌 JSO</p>
    <div class="spinner-row">
      <label for="spinnerJso">JSO</label>
      <select id="spinnerJso"></select>
    </div>
    <div class="spinner-row">
      <label for="spinnerJsoSplitter">Splitter (JSO)</label>
      <select id="spinnerJsoSplitter">
        <option value="">-- Selecionar --</option>
      </select>
    </div>
  </div>

  <div class="divider-or">ou</div>

  <div class="card">
    <p class="card-title">📦 PDO / Porto</p>
    <div class="spinner-row">
      <label for="spinnerPdo">PDO</label>
      <select id="spinnerPdo"></select>
    </div>
    <div class="spinner-row">
      <label for="spinnerPorto">Porto</label>
      <select id="spinnerPorto"></select>
    </div>
  </div>

  <button id="btnPesquisar" class="primary">🔍 Pesquisar</button>
  <button id="btnLimparTudo">🧹 Limpar Tudo</button>

  <label class="checkbox-row" id="labelSoLivres" style="display:none;">
    <input type="checkbox" id="checkboxSoLivres">
    <span>Mostrar só portos livres</span>
  </label>

  <div id="textResult" class="result-box"></div>
  <div class="result-actions" id="resultActions" style="display:none;">
    <button id="btnCopiar">📋 Copiar</button>
    <button id="btnPartilhar">📤 Partilhar</button>
  </div>

  <div class="card" id="historyCard" style="margin-top:16px;">
    <p class="card-title">🕒 Histórico de Pesquisas
      <button class="history-clear" id="btnClearHistory" style="margin-left:auto;">limpar</button>
    </p>
    <div id="historyList"></div>
  </div>

</div>

<script src="app.js" charset="UTF-8"></script>
<script src="sw-register.js"></script>
</body>
</html>
