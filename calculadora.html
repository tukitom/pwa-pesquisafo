<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161a">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PesquisaFO">
<title>Calculadora de Cores</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <nav>
    <button onclick="window.location.href='index.html'">🏠 Início</button>
    <button onclick="window.location.href='app.html'">📂 CSV</button>
    <button class="active" onclick="window.location.href='calculadora.html'">🎨 Calculadora</button>
    <button onclick="window.location.href='comparar.html'">🔀 Comparar</button>
  </nav>
</header>

<main>
  <div class="card">
    <p class="card-title">🎨 Calcular Cor da Fibra</p>
    <label for="editFibra" class="visually-hidden">Número da Fibra</label>
    <input id="editFibra" type="number" placeholder="Número da Fibra (1-288)" min="1" max="288">
    <button id="btnCalcularCor" class="primary">Calcular</button>
    <div id="textCorResult"></div>
  </div>

  <div class="card">
    <p class="card-title">📋 Tabela de Identificação de Fibras Ópticas (1–288)</p>
    <div id="tabelaFibra"></div>
    <button id="btnPDF" style="margin-top:14px;">📄 Exportar PDF</button>
  </div>
</main>

<!-- jsPDF para exportar -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const fibraColors = {
  1:"#FFFFFF",2:"#FF0000",3:"#00FF00",4:"#0000FF",5:"#000000",6:"#FFFF00",
  7:"#FFA500",8:"#808080",9:"#8B4513",10:"#800080",11:"#FFC0CB",12:"#40E0D0"
};

document.getElementById("btnCalcularCor").onclick = () => {
  const numero = parseInt(document.getElementById("editFibra").value);
  if (!numero || numero < 1 || numero > 288) {
    alert("Insira um número válido (1-288).");
    return;
  }
  const corIndexFibra = ((numero - 1) % 12) + 1;
  const corFibra = fibraColors[corIndexFibra];
  const tubo = Math.floor((numero - 1) / 12) + 1;
  const corTubo = fibraColors[((tubo - 1) % 12) + 1];
  document.getElementById("textCorResult").innerHTML = `
    <div class="color-result">
      <div class="cr-item">
        <div class="dot-lg" style="background:${corFibra}"></div>
        <span class="cr-label">Fibra ${numero}</span>
      </div>
      <div class="cr-item">
        <div class="dot-lg" style="background:${corTubo}"></div>
        <span class="cr-label">Tubo ${tubo}</span>
      </div>
    </div>`;
};

document.getElementById("editFibra").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("btnCalcularCor").click();
});

// === TABELA COLORIDA ===
const cores = [
  ["Branco","#FFFFFF","BR"],
  ["Vermelho","#FF0000","VM"],
  ["Verde","#00FF00","VD"],
  ["Azul","#0000FF","AZ"],
  ["Preto","#000000","PR"],
  ["Amarelo","#FFFF00","AM"],
  ["Laranja","#FFA500","LR"],
  ["Cinza","#808080","CZ"],
  ["Marrom","#8B4513","CT"],
  ["Violeta","#800080","VT"],
  ["Rosa","#FFC0CB","RS"],
  ["Turquesa","#40E0D0","TQ"]
];

function gerarTabela(){
  let html = `<table><thead><tr><th class='sigla'>Sigla</th>`;
  for(let t=1;t<=24;t++){
    const corTubo = cores[(t-1)%12][1];
    const textColor = ["#000000","#8B4513","#800080","#808080","#0000FF","#FF0000"].includes(corTubo) ? "#fff" : "#000";
    html += `<th style="background:${corTubo};color:${textColor}">${t}</th>`;
  }
  html += `</tr></thead><tbody>`;

  for(let f=0;f<12;f++){
    const [_, corFibra, sigla] = cores[f];
    html += `<tr><td class='sigla'>${sigla}</td>`;
    for(let t=1;t<=24;t++){
      const numero = (t - 1) * 12 + (f + 1);
      const textColor = ["#000000","#8B4513","#800080","#808080","#0000FF","#FF0000"].includes(corFibra) ? "#fff" : "#000";
      html += `<td style="background:${corFibra};color:${textColor}">${numero}</td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table>`;
  document.getElementById("tabelaFibra").innerHTML = html;
}
gerarTabela();

// === EXPORTAR PARA PDF ===
document.getElementById("btnPDF").addEventListener("click", async () => {
  const btn = document.getElementById("btnPDF");
  const original = btn.textContent;
  btn.textContent = "⏳ A gerar PDF...";
  btn.disabled = true;
  try {
    const { jsPDF } = window.jspdf;
    const tabela = document.querySelector("#tabelaFibra table");
    // Captura a tabela na largura real (scrollWidth), não apenas a parte visível
    // no ecrã — essencial em telemóveis, onde a tabela é mais larga que o viewport.
    const canvas = await html2canvas(tabela, {
      backgroundColor: "#1d2025",
      scale: 2,
      width: tabela.scrollWidth,
      height: tabela.scrollHeight,
      windowWidth: tabela.scrollWidth,
      windowHeight: tabela.scrollHeight
    });
    const imgData = canvas.toDataURL("image/png");
    const pdf = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth - 40;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    const finalHeight = Math.min(imgHeight, pageHeight - 40);
    const finalWidth = finalHeight === imgHeight ? imgWidth : (canvas.width * finalHeight) / canvas.height;
    pdf.addImage(imgData, "PNG", 20, 20, finalWidth, finalHeight);
    pdf.save("Tabela_Fibras_Opticas.pdf");
  } catch (e) {
    alert("Não foi possível gerar o PDF. Tenta novamente.");
    console.error(e);
  } finally {
    btn.textContent = original;
    btn.disabled = false;
  }
});
</script>
<script src="sw-register.js"></script>
</body>
</html>
