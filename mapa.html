<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PesquisaFO">
<title>Mapa Interativo FO Flores</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <nav>
    <button onclick="window.location.href='index.html'">🏠 Início</button>
    <button onclick="window.location.href='app.html'">📂 CSV</button>
    <button onclick="window.location.href='calculadora.html'">🎨 Calculadora</button>
    <button class="active" onclick="window.location.href='mapa.html'">🗺️ Mapa</button>
  </nav>
</header>

<div class="card">
  <div id="searchBox">
    <input id="searchInput" type="text" placeholder="Ex: PDO1001, JFO1001 ou SRO1001...">
    <button id="btnSearch" style="width:auto;flex-shrink:0;">🔍</button>
  </div>
  <select id="filterSelect">
    <option value="todos">Todos os locais</option>
    <option value="pdo">Só PDOs</option>
    <option value="jfo">Só Juntas</option>
    <option value="sro">Só SROs</option>
  </select>
  <div class="map-legend" id="mapLegend"></div>
  <div id="mapStatus" class="map-loading">A carregar locais...</div>
</div>

<div class="card">
  <button id="btnAdminLogin">🔑 Entrar como Administrador</button>
</div>

<div class="card" id="adminCard" style="display:none;">
  <p class="card-title">✏️ Editar Mapa (Administrador)</p>
  <button id="btnModoAdicionar">➕ Adicionar Ponto</button>
  <div class="result-actions">
    <button id="btnExportar">⬇️ Exportar Ficheiro Atualizado</button>
    <button id="btnRepor">↩️ Repor Original</button>
  </div>
  <p style="font-size:12px;color:var(--text-dim);margin-top:8px;">
    O ficheiro exportado tem a mesma estrutura de "Locais etiquetados.json" — substitui esse
    ficheiro no repositório do GitHub para tornar as alterações permanentes para todos.
  </p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>
<script>
  // ================= SHA-256 (implementação própria, sem depender de HTTPS/crypto.subtle) =================
  function sha256Hex(str) {
    function rotr(n, x) { return (x >>> n) | (x << (32 - n)); }
    const K = [
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ];
    let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

    const bytes = new TextEncoder().encode(str);
    const bitLen = bytes.length * 8;
    const withOne = new Uint8Array(((bytes.length + 9 + 63) >> 6) << 6);
    withOne.set(bytes);
    withOne[bytes.length] = 0x80;
    const dv = new DataView(withOne.buffer);
    dv.setUint32(withOne.length - 4, bitLen >>> 0);

    for (let chunk = 0; chunk < withOne.length; chunk += 64) {
      const w = new Array(64);
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(chunk + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(7, w[i-15]) ^ rotr(18, w[i-15]) ^ (w[i-15] >>> 3);
        const s1 = rotr(17, w[i-2]) ^ rotr(19, w[i-2]) ^ (w[i-2] >>> 10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
      }
      let [a,b,c,d,e,f,g,h] = H;
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(6,e) ^ rotr(11,e) ^ rotr(25,e);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
        const S0 = rotr(2,a) ^ rotr(13,a) ^ rotr(22,a);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) | 0;
        h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
      }
      H = [H[0]+a|0,H[1]+b|0,H[2]+c|0,H[3]+d|0,H[4]+e|0,H[5]+f|0,H[6]+g|0,H[7]+h|0];
    }
    return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
  }

  // ================= ADMIN =================
  // Evita que um nome de ponto com HTML/JS embutido (vindo do ficheiro de
  // locais ou escrito por um administrador) seja executado pela app —
  // protege TODOS os utilizadores, não só quem edita o mapa.
  function escapeHtml(valor) {
    return String(valor ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  const ADMIN_HASH = "95464b02fe9fbde0f0d2817c28a76b3ef9dc803791651d856b4acba91397b720";
  const ADMIN_KEY = "fo_mapa_admin";
  let isAdmin = false;
  try { isAdmin = localStorage.getItem(ADMIN_KEY) === "1"; } catch (e) {}

  const btnAdminLogin = document.getElementById("btnAdminLogin");
  const adminCard = document.getElementById("adminCard");

  function atualizarUiAdmin() {
    adminCard.style.display = isAdmin ? "block" : "none";
    btnAdminLogin.textContent = isAdmin ? "🔓 Sair do Modo Administrador" : "🔑 Entrar como Administrador";
  }
  atualizarUiAdmin();

  btnAdminLogin.addEventListener("click", () => {
    if (isAdmin) {
      if (!confirm("Sair do modo administrador?")) return;
      isAdmin = false;
      try { localStorage.removeItem(ADMIN_KEY); } catch (e) {}
      atualizarUiAdmin();
      renderizar();
      return;
    }
    const pass = prompt("Password de administrador:");
    if (!pass) return;
    if (sha256Hex(pass) === ADMIN_HASH) {
      isAdmin = true;
      try { localStorage.setItem(ADMIN_KEY, "1"); } catch (e) {}
      atualizarUiAdmin();
      renderizar();
      alert("Modo administrador ativado neste dispositivo.");
    } else {
      alert("Password incorreta.");
    }
  });

  // ================= MAPA =================
  const OVERRIDES_KEY = "fo_mapa_overrides";

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        google: {
          type: 'raster',
          tiles: ['https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'],
          tileSize: 256,
          attribution: '© Google Maps'
        }
      },
      layers: [{ id: 'google-hybrid', type: 'raster', source: 'google', minzoom: 0, maxzoom: 22 }]
    },
    center: [-31.13, 39.454],
    zoom: 13,
    attributionControl: true
  });

  map.addControl(new maplibregl.NavigationControl());
  map.addControl(new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true,
    showUserHeading: true
  }));

  const mapStatus = document.getElementById("mapStatus");
  const mapLegend = document.getElementById("mapLegend");
  const btnModoAdicionar = document.getElementById("btnModoAdicionar");

  let baseFeatures = [];       // pontos originais do ficheiro Locais etiquetados.json
  let overrides = carregarOverrides();
  let marcadoresAtuais = [];   // [{id, nome, tipo, marker, origem}]
  let modoAdicionar = false;
  let filtroAtual = "todos";

  function carregarOverrides() {
    try {
      const raw = localStorage.getItem(OVERRIDES_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { added: [], edited: {}, deleted: [] };
  }

  function guardarOverrides() {
    try {
      localStorage.setItem(OVERRIDES_KEY, JSON.stringify(overrides));
    } catch (e) {
      alert("Não foi possível guardar a alteração neste dispositivo (armazenamento cheio ou indisponível).");
    }
  }

  function detectarTipo(nome) {
    const n = nome.toLowerCase();
    if (n.includes("pdo")) return "pdo";
    if (n.includes("jfo")) return "jfo";
    if (n.includes("sro")) return "sro";
    return "outro";
  }

  function corPorTipo(tipo) {
    return tipo === "pdo" ? "dodgerblue"
      : tipo === "jfo" ? "lime"
      : tipo === "sro" ? "orange"
      : "gray";
  }

  // Junta os pontos originais (menos os apagados, com as edições aplicadas)
  // com os pontos adicionados pelo administrador.
  function montarListaFinal() {
    const lista = [];

    baseFeatures.forEach(f => {
      if (overrides.deleted.includes(f.nome)) return;
      const edit = overrides.edited[f.nome];
      const nome = edit?.nome || f.nome;
      const lat = edit?.lat ?? f.lat;
      const lng = edit?.lng ?? f.lng;
      lista.push({ id: f.nome, nome, lat, lng, tipo: detectarTipo(nome), origem: "base" });
    });

    overrides.added.forEach(p => {
      lista.push({ id: p.id, nome: p.nome, lat: p.lat, lng: p.lng, tipo: detectarTipo(p.nome), origem: "added" });
    });

    return lista;
  }

  function popupHtml(ponto) {
    const tipoLabel = { pdo: "PDO", jfo: "Junta (JFO)", sro: "SRO", outro: "Outro" }[ponto.tipo];
    let html = `
      <div class="map-popup">
        <div class="map-popup-title">${escapeHtml(ponto.nome)}</div>
        <div class="map-popup-tipo">${tipoLabel}${ponto.origem === "added" ? " · adicionado" : ""}</div>`;
    if (isAdmin) {
      html += `
        <div class="map-popup-hint">Arrasta o marcador para mover</div>
        <div class="map-popup-actions">
          <button class="popup-btn" data-action="renomear" data-id="${escapeHtml(ponto.id)}">✏️ Renomear</button>
          <button class="popup-btn popup-btn-danger" data-action="apagar" data-id="${escapeHtml(ponto.id)}">🗑️ Apagar</button>
        </div>`;
    }
    html += `</div>`;
    return html;
  }

  function renderizar() {
    marcadoresAtuais.forEach(m => m.marker.remove());
    marcadoresAtuais = [];

    const lista = montarListaFinal();
    const contagens = { pdo: 0, jfo: 0, sro: 0, outro: 0 };

    lista.forEach(ponto => {
      contagens[ponto.tipo]++;

      const cor = corPorTipo(ponto.tipo);
      const popup = new maplibregl.Popup({ closeButton: true, closeOnClick: false })
        .setHTML(popupHtml(ponto));

      const marker = new maplibregl.Marker({ color: cor, draggable: isAdmin })
        .setLngLat([ponto.lng, ponto.lat])
        .setPopup(popup)
        .addTo(map);

      if (isAdmin) {
        marker.on("dragend", () => {
          const pos = marker.getLngLat();
          guardarPosicao(ponto, pos.lat, pos.lng);
        });
      }

      marcadoresAtuais.push({ id: ponto.id, nome: ponto.nome, tipo: ponto.tipo, marker, origem: ponto.origem });
    });

    aplicarFiltro(filtroAtual);
    atualizarLegenda(contagens);
  }

  function guardarPosicao(ponto, lat, lng) {
    if (ponto.origem === "added") {
      const item = overrides.added.find(p => p.id === ponto.id);
      if (item) { item.lat = lat; item.lng = lng; }
    } else {
      overrides.edited[ponto.id] = { ...(overrides.edited[ponto.id] || {}), lat, lng };
    }
    guardarOverrides();
  }

  window.renomearPonto = function (id) {
    if (!isAdmin) return;
    const atual = marcadoresAtuais.find(m => m.id === id);
    if (!atual) return;
    const novoNome = prompt("Novo nome para este ponto:", atual.nome);
    if (!novoNome || !novoNome.trim() || novoNome.trim() === atual.nome) return;
    const nomeFinal = novoNome.trim();

    if (atual.origem === "added") {
      const item = overrides.added.find(p => p.id === id);
      if (item) item.nome = nomeFinal;
    } else {
      overrides.edited[id] = { ...(overrides.edited[id] || {}), nome: nomeFinal };
    }
    guardarOverrides();
    renderizar();
  };

  window.apagarPonto = function (id) {
    if (!isAdmin) return;
    const atual = marcadoresAtuais.find(m => m.id === id);
    if (!atual) return;
    if (!confirm(`Apagar "${atual.nome}" do mapa?`)) return;

    if (atual.origem === "added") {
      overrides.added = overrides.added.filter(p => p.id !== id);
    } else {
      if (!overrides.deleted.includes(id)) overrides.deleted.push(id);
      delete overrides.edited[id];
    }
    guardarOverrides();
    renderizar();
  };

  // Delegação de eventos: os botões dos popups são inseridos como HTML puro
  // (não é seguro usar onclick="...(${valor})" com texto vindo de fora),
  // por isso ouvimos os cliques a partir do documento.
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const { action, id } = btn.dataset;
    if (action === "renomear") window.renomearPonto(id);
    else if (action === "apagar") window.apagarPonto(id);
  });

  function atualizarLegenda(contagens) {
    mapLegend.innerHTML = `
      <span><span class="dot" style="background:dodgerblue"></span> PDO (${contagens.pdo})</span>
      <span><span class="dot" style="background:lime"></span> Junta (${contagens.jfo})</span>
      <span><span class="dot" style="background:orange"></span> SRO (${contagens.sro})</span>
      ${contagens.outro ? `<span><span class="dot" style="background:gray"></span> Outro (${contagens.outro})</span>` : ""}
    `;
  }

  function aplicarFiltro(filtro) {
    filtroAtual = filtro;
    marcadoresAtuais.forEach(({ tipo, marker }) => {
      if (filtro === "todos" || filtro === tipo) marker.addTo(map);
      else marker.remove();
    });
  }

  // ================= CARREGAR DADOS =================
  fetch("Locais etiquetados.json")
    .then(res => res.json())
    .then(data => {
      baseFeatures = data.features.map(f => ({
        nome: f.properties.name,
        lat: f.geometry.coordinates[1],
        lng: f.geometry.coordinates[0]
      }));
      renderizar();

      const lista = montarListaFinal();
      mapStatus.textContent = `${lista.length} locais carregados`;
      setTimeout(() => { mapStatus.style.display = "none"; }, 2500);

      if (lista.length) {
        const bounds = new maplibregl.LngLatBounds();
        lista.forEach(p => bounds.extend([p.lng, p.lat]));
        map.fitBounds(bounds, { padding: 50, maxZoom: 15, duration: 0 });
      }
    })
    .catch(() => {
      mapStatus.textContent = "❌ Não foi possível carregar os locais.";
    });

  // ================= PESQUISA =================
  document.getElementById("btnSearch").addEventListener("click", () => {
    const termo = document.getElementById("searchInput").value.trim().toLowerCase();
    if (!termo) return alert("Escreve o nome do PDO, JFO ou SRO.");
    const encontrado = marcadoresAtuais.find(m => m.nome.toLowerCase().includes(termo));
    if (!encontrado) return alert("Local não encontrado!");
    const pos = encontrado.marker.getLngLat();
    map.flyTo({ center: pos, zoom: 17, speed: 0.8 });
    encontrado.marker.togglePopup();
  });

  document.getElementById("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("btnSearch").click();
  });

  document.getElementById("filterSelect").addEventListener("change", (e) => {
    aplicarFiltro(e.target.value);
  });

  // ================= ADICIONAR PONTO (só admin) =================
  btnModoAdicionar.addEventListener("click", () => {
    if (!isAdmin) return;
    modoAdicionar = !modoAdicionar;
    btnModoAdicionar.classList.toggle("active", modoAdicionar);
    btnModoAdicionar.textContent = modoAdicionar ? "✅ Toca no mapa para adicionar" : "➕ Adicionar Ponto";
    map.getCanvas().style.cursor = modoAdicionar ? "crosshair" : "";
  });

  map.on("click", (e) => {
    if (!isAdmin || !modoAdicionar) return;
    const nome = prompt("Nome do novo ponto (ex: PDO1200, JFO50, SRO20):");
    if (!nome || !nome.trim()) return;
    const nomeFinal = nome.trim();

    const existe = marcadoresAtuais.some(m => m.nome.toLowerCase() === nomeFinal.toLowerCase());
    if (existe && !confirm(`Já existe um ponto chamado "${nomeFinal}". Adicionar mesmo assim?`)) return;

    overrides.added.push({
      id: "added-" + Date.now(),
      nome: nomeFinal,
      lat: e.lngLat.lat,
      lng: e.lngLat.lng
    });
    guardarOverrides();
    renderizar();
  });

  // ================= EXPORTAR (ficheiro completo, pronto para o GitHub) / REPOR =================
  document.getElementById("btnExportar").addEventListener("click", () => {
    if (!isAdmin) return;
    const lista = montarListaFinal();
    const geojson = {
      type: "FeatureCollection",
      features: lista
        .slice()
        .sort((a, b) => a.nome.localeCompare(b.nome, undefined, { numeric: true }))
        .map(p => ({
          type: "Feature",
          properties: { name: p.nome },
          geometry: { type: "Point", coordinates: [p.lng, p.lat] }
        }))
    };
    const conteudo = JSON.stringify(geojson, null, 2);
    const blob = new Blob([conteudo], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Locais etiquetados.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    alert(`Ficheiro gerado com ${geojson.features.length} pontos. Substitui "Locais etiquetados.json" no GitHub por este ficheiro.`);
  });

  document.getElementById("btnRepor").addEventListener("click", () => {
    if (!isAdmin) return;
    if (!confirm("Repor o mapa para o estado original? Perdes todas as alterações feitas neste dispositivo (a não ser que já as tenhas exportado).")) return;
    overrides = { added: [], edited: {}, deleted: [] };
    guardarOverrides();
    renderizar();
  });
</script>
<script src="sw-register.js"></script>
</body>
</html>
