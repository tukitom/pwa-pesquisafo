<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa Interativo FO Flores</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <nav>
    <button onclick="window.location.href='index.html'">🏠 Início</button>
    <button onclick="window.location.href='app.html'">📂 CSV</button>
    <button onclick="window.location.href='calculadora.html'">🎨 Calculadora</button>
    <button class="active" onclick="window.location.href='mapa.html'">🗺️ Mapa</button>
  </nav>
</header>

<div class="card">
  <div id="searchBox">
    <input id="searchInput" type="text" placeholder="Ex: PDO1001, JFO1001 ou SRO1001...">
    <button id="btnSearch" style="width:auto;flex-shrink:0;">🔍</button>
  </div>
  <select id="filterSelect">
    <option value="todos">Todos os locais</option>
    <option value="pdo">Só PDOs</option>
    <option value="jfo">Só Juntas</option>
    <option value="sro">Só SROs</option>
  </select>
  <div class="map-legend">
    <span><span class="dot" style="background:dodgerblue"></span> PDO</span>
    <span><span class="dot" style="background:lime"></span> Junta (JFO)</span>
    <span><span class="dot" style="background:orange"></span> SRO</span>
  </div>
  <div id="mapStatus" class="map-loading">A carregar locais...</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>
<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        google: {
          type: 'raster',
          tiles: [
            'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'
          ],
          tileSize: 256,
          attribution: '© Google Maps'
        }
      },
      layers: [
        {
          id: 'google-hybrid',
          type: 'raster',
          source: 'google',
          minzoom: 0,
          maxzoom: 22
        }
      ]
    },
    center: [-31.13, 39.454],
    zoom: 13,
    pitch: 0,
    bearing: 0,
    attributionControl: true
  });

  map.addControl(new maplibregl.NavigationControl());

  map.addControl(
    new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    })
  );

  let todosOsMarkers = [];
  const mapStatus = document.getElementById("mapStatus");

  fetch("Locais etiquetados.json")
    .then(res => res.json())
    .then(data => {
      data.features.forEach(f => {
        const [lng, lat] = f.geometry.coordinates;
        const nome = f.properties.name;

        let tipo = "outro";
        if (nome.toLowerCase().includes("pdo")) tipo = "pdo";
        else if (nome.toLowerCase().includes("jfo")) tipo = "jfo";
        else if (nome.toLowerCase().includes("sro")) tipo = "sro";

        const color =
          tipo === "pdo" ? "dodgerblue" :
          tipo === "jfo" ? "lime" :
          tipo === "sro" ? "orange" :
          "gray";

        const popup = new maplibregl.Popup({ closeButton: true })
          .setHTML(`<div style="color:black;font-weight:600;">${nome}</div>`);

        const marker = new maplibregl.Marker({ color })
          .setLngLat([lng, lat])
          .setPopup(popup)
          .addTo(map);

        todosOsMarkers.push({ nome, tipo, marker });
      });
      mapStatus.textContent = `${todosOsMarkers.length} locais carregados`;
      setTimeout(() => { mapStatus.style.display = "none"; }, 2500);
    })
    .catch(() => {
      mapStatus.textContent = "❌ Não foi possível carregar os locais.";
    });

  document.getElementById("btnSearch").addEventListener("click", () => {
    const termo = document.getElementById("searchInput").value.trim().toLowerCase();
    if (!termo) return alert("Escreve o nome do PDO, JFO ou SRO.");
    const encontrado = todosOsMarkers.find(m => m.nome.toLowerCase().includes(termo));
    if (!encontrado) return alert("Local não encontrado!");
    const pos = encontrado.marker.getLngLat();
    map.flyTo({ center: pos, zoom: 17, speed: 0.8 });
    encontrado.marker.togglePopup();
  });

  document.getElementById("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("btnSearch").click();
  });

  document.getElementById("filterSelect").addEventListener("change", (e) => {
    const filtro = e.target.value;
    todosOsMarkers.forEach(({ tipo, marker }) => {
      if (filtro === "todos" || filtro === tipo) marker.addTo(map);
      else marker.remove();
    });
  });
</script>
</body>
</html>
